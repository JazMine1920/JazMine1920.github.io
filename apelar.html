<body>

<!-- NAVBAR ESTABLE -->
<div class="navbar">

      <i class="fab fa-discord" style="font-size: 24px; color: #5865F2;"></i>

    <a href="postulacion.html" id="link-postulacion">Postulaciones</a>
    <a href="apelar.html" id="link-apelar">Apelaciones</a>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">

    <div class="sidebar-avatar"><img id="sidebarAvatar" src="default.png" alt="Avatar" /></div>

  <div class="sidebar-logout" id="sidebarLogout" style="display:none;">

<!-- CONTENIDO DE APELACIÓN -->
<div class="container animate-slide-up" id="contenido">
  <form class="formulario animate-fade-in" id="formulario">
    <input type="email" id="correo" placeholder="Correo electrónico" required />
    <textarea id="razon_ban" placeholder="¿Por qué fuiste baneado?" required></textarea>
    <textarea id="apelacion" placeholder="¿Por qué deberíamos quitarte el baneo?" required></textarea>
    <button type="submit">Enviar Apelación</button>
  </form>
</div>

<img src="Paimon.gif" alt="Decoración" class="decoracion-img animate-float" id="decoracion" />

  <script>
    async function getDiscordUser(token) {
      const res = await fetch("https://discord.com/api/users/@me", {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      return await res.json();
    }

    async function handleAuth() {
      const hash = window.location.hash;
      if (hash.includes("access_token")) {
        const params = new URLSearchParams(hash.slice(1));
        const token = params.get("access_token");

        try {
          const userData = await getDiscordUser(token);
          localStorage.setItem("discordUser", JSON.stringify(userData));
          localStorage.setItem("discordToken", token);
          window.location.hash = "";
          location.reload();
        } catch (error) {
          alert("No se pudo autenticar con Discord.");
        }
      } else {
        const storedUser = localStorage.getItem("discordUser");
        if (storedUser) {
          const user = JSON.parse(storedUser);
          document.querySelector(".login-btn").style.display = "none";
        }
      }
    }

    function loginWithDiscord() {
      window.location.href = "https://discord.com/oauth2/authorize?client_id=1377488695799582811&response_type=code&redirect_uri=http%3A%2F%2Fjazmine1920.github.io%2Fpostulacion.html&scope=identify";
    }

    handleAuth();
  </script>
<script src="Scrips.js"></script>
