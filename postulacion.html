<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Postulación Staff</title>
  <link rel="stylesheet" href="estilos.css" />
  <link rel="stylesheet" href="animaciones.css" />
</head>
<body>
  <!-- Barra de navegación -->
  <div class="navbar">
    <a href="postulacion.html">Postular</a>
    <a href="apelar.html">Apelar baneo</a>
  </div>

  <div class="intro animate-fade-in">Cuéntanos más sobre ti...</div>

  <div class="container animate-slide-up">
    <div class="profile animate-zoom-in">
      <div class="profile-pic">
        <img id="avatar" src="default.png" alt="Foto de perfil" />
      </div>
      <div class="profile-name" id="username">Usuario</div>
    </div>

    <form class="formulario animate-fade-in" id="formulario">
      <input type="text" id="edad" placeholder="Edad" required />
      <textarea id="pais" placeholder="País" required></textarea>
      <textarea id="experiencia" placeholder="¿Tienes experiencia previa?" required></textarea>
      <button type="button" id="next">Siguiente</button>
    </form>
  </div>

  <img src="Paimon.gif" alt="Decoración" class="decoracion-img animate-float" />

  <script>
    let user;
    const hash = window.location.hash;
    if (localStorage.getItem("discordUser")) {
      user = JSON.parse(localStorage.getItem("discordUser"));
      updateUserProfile(user);
    } else if (hash.includes("access_token")) {
      const params = new URLSearchParams(hash.slice(1));
      const token = params.get("access_token");

      fetch("https://discord.com/api/users/@me", {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(userData => {
        localStorage.setItem("discordUser", JSON.stringify(userData));
        user = userData;
        updateUserProfile(user);
        window.location.hash = ""; // Limpia el hash
      });
    } else {
      window.location.href = "https://discord.com/oauth2/authorize?client_id=1377488695799582811&response_type=code&redirect_uri=https%3A%2F%2Fjazmine1920.github.io%2Fpostulacion&scope=identify";
    }

    function updateUserProfile(user) {
      const avatarFormat = user.avatar.startsWith("a_") ? "gif" : "png";
      const avatarURL = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${avatarFormat}`;
      document.getElementById("avatar").src = avatarURL;
      document.getElementById("username").textContent = user.username;
    }

    document.getElementById("next").addEventListener("click", () => {
      const edad = document.getElementById("edad").value;
      const pais = document.getElementById("pais").value;
      const experiencia = document.getElementById("experiencia").value;

      document.getElementById("formulario").innerHTML = `
        <textarea id="razon" placeholder="¿Por qué quieres ser parte del staff?" required></textarea>
        <textarea id="horario" placeholder="¿Qué horario tienes disponible?" required></textarea>
        <textarea id="historial" placeholder="¿Has sido parte de algún staff antes?" required></textarea>
        <button type="submit">Enviar</button>
      `;

      document.querySelector("#formulario").addEventListener("submit", e => {
        e.preventDefault();
        const razon = document.getElementById("razon").value;
        const horario = document.getElementById("horario").value;
        const historial = document.getElementById("historial").value;

        const avatarFormat = user.avatar.startsWith("a_") ? "gif" : "png";
        const avatarURL = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${avatarFormat}`;

        fetch("https://discord.com/api/webhooks/1377521261579604029/RG03fM4EC7gzr8nnognq2QtMvHmBzYsg-vd7sNF0X7ZZotj8fg0eYitD0y_wQiSmVbqA", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            embeds: [
              {
                title: "📥 Nueva Postulación de Staff",
                color: 0x4f46e5,
                fields: [
                  { name: "👤 Usuario", value: `${user.username}#${user.discriminator} (ID: ${user.id})`, inline: false },
                  { name: "Edad", value: edad || "No respondido", inline: true },
                  { name: "País", value: pais || "No respondido", inline: true },
                  { name: "Experiencia previa", value: experiencia || "No respondido", inline: false },
                  { name: "Razón para ser staff", value: razon || "No respondido", inline: false },
                  { name: "Horario disponible", value: horario || "No respondido", inline: true },
                  { name: "Historial como staff", value: historial || "No respondido", inline: false }
                ],
                thumbnail: {
                  url: avatarURL
                },
                footer: {
                  text: `ID del usuario: ${user.id}`
                },
                timestamp: new Date().toISOString()
              }
            ]
          })
        }).then(() => alert("✅ ¡Postulación enviada con éxito!"));
      });
    });
  </script>
</body>
</html>
